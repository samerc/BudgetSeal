name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Drift's in-memory test databases load the system SQLite.
      - name: Install SQLite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Get packages
        run: flutter pub get

      # The generated strings are committed: a changed ARB without
      # `flutter gen-l10n` would ship stale text.
      - name: Strings are generated
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated

      - name: Analyze
        run: dart analyze lib/

      - name: Test
        run: flutter test
