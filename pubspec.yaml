name: budgetseal
description: Allocation-first household finance manager.
publish_to: 'none'
version: 0.9.0+10

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database — Drift (type-safe SQLite ORM)
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # State management — Riverpod
  flutter_riverpod: ^3.4.0

  # Material You dynamic theming
  dynamic_color: ^1.9.0

  # Navigation
  go_router: ^17.5.0

  # HTTP
  dio: ^5.11.0
  http: ^1.0.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.0

  # Charts
  fl_chart: ^1.2.0

  # Storage & file access
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  package_info_plus: ^10.2.0
  path: ^1.9.0

  # UI helpers
  google_fonts: ^8.2.0
  shimmer: ^3.0.0
  local_auth: ^3.0.0
  image_picker: ^1.1.0
  csv: ^8.0.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.0

  # Cloud sync
  google_sign_in: ^7.0.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  sliver_tools: ^0.2.12
  timezone: ^0.11.0
  confetti: ^0.8.0
  google_mlkit_text_recognition: ^0.17.1
  encrypt: ^5.0.3
  flutter_secure_storage: ^11.2.0
  pointycastle: ^3.9.1
  flutter_timezone: ^5.0.2

  # Web Companion (local HTTP server)
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^8.2.0
  qr_widget: ^4.1.0
  flutter_foreground_task: ^11.0.3
  wakelock_plus: ^1.8.0
  crypto: ^3.0.0
  webview_flutter: ^4.14.0
  quick_actions: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.16.0
  drift_dev: ^2.35.0

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1C1D24"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Keeps the envelope inside the 66dp safe zone of every launcher mask.
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/categories/
    - assets/web/

  # Brand display face for amounts and screen titles (SIL OFL 1.1, see
  # assets/fonts/OFL-BricolageGrotesque.txt). Bundled so it works offline.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
